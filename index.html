<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Historical River Explorer</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: #0a1d2c;
            color: #e0e8f0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        #map { position: absolute; inset: 0; }

        /* ── Header ──────────────────────────────────────────────── */
        #header {
            position: absolute;
            top: 0; left: 0; right: 0;
            background: rgba(10, 29, 44, 0.93);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
        }
        #header:not(.expanded) .header-body { display: none; }

        .header-bar {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            gap: 8px;
            min-height: 42px;
        }
        #header-toggle {
            background: none;
            border: none;
            color: #7a9ab0;
            cursor: pointer;
            font-size: 18px;
            padding: 2px 6px;
            line-height: 1;
        }
        #header-toggle:hover { color: #c0d8f0; }

        h1 { font-size: 14px; font-weight: 600; color: #e0e8f0; flex: 1; }
        #count-label { font-size: 11px; color: #5a8aa0; }

        .header-body {
            padding: 6px 12px 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: flex-start;
        }

        .ctrl-group { display: flex; flex-direction: column; gap: 5px; }
        .ctrl-label {
            font-size: 10px;
            color: #5a8aa0;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .btn-row { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }

        .btn {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.14);
            color: #b0c8dc;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            white-space: nowrap;
            transition: background 0.15s;
        }
        .btn:hover { background: rgba(255, 255, 255, 0.13); }
        .btn.active { background: #1a4a6a; border-color: #3a7a9a; color: #7dd4ff; }

        /* ── Year slider ──────────────────────────────────────────── */
        .year-readout {
            display: flex;
            align-items: baseline;
            gap: 5px;
            margin-bottom: 2px;
        }
        #year-display {
            font-size: 22px;
            font-weight: 700;
            color: #e0e8f0;
            line-height: 1;
            min-width: 56px;
        }
        .year-suffix { font-size: 12px; color: #7a9ab0; }
        #year-slider {
            display: block;
            width: 200px;
            accent-color: #3a9acc;
            cursor: pointer;
        }
        .year-ends {
            display: flex;
            justify-content: space-between;
            width: 200px;
            font-size: 10px;
            color: #3a6a80;
            margin-top: 2px;
        }

        /* ── Info bar ─────────────────────────────────────────────── */
        #info-bar {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: rgba(10, 29, 44, 0.93);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 16px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 44px;
        }
        .river-swatch {
            width: 28px;
            height: 4px;
            border-radius: 2px;
            background: #FFC107;
            flex-shrink: 0;
            opacity: 0;
            transition: opacity 0.2s;
        }
        #info-bar:not(.empty) .river-swatch { opacity: 1; }
        #selected-name { font-size: 15px; font-weight: 600; color: #e0e8f0; }
        #info-bar.empty #selected-name {
            color: #3a6a80;
            font-style: italic;
            font-weight: 400;
        }
        #selected-rank { margin-left: auto; font-size: 11px; color: #5a8aa0; }

        /* ── Legend ───────────────────────────────────────────────── */
        #legend {
            position: absolute;
            bottom: 54px;
            right: 10px;
            background: rgba(10, 29, 44, 0.88);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 8px 10px;
            z-index: 10;
            font-size: 11px;
        }
        .legend-title {
            font-size: 10px;
            color: #5a8aa0;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            margin-bottom: 6px;
        }
        .legend-row {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 4px;
            color: #90afc0;
        }
        .l-line {
            flex-shrink: 0;
            border-radius: 2px;
            background: #75A8C8;
        }

        /* ── Style-switching spinner ─────────────────────────────── */
        #loading-badge {
            display: none;
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 29, 44, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #7a9ab0;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 20;
            pointer-events: none;
        }
        #loading-badge.show { display: block; }

        /* ── MapLibre tweaks ──────────────────────────────────────── */
        .maplibregl-ctrl-attrib { font-size: 10px; }
        .maplibregl-popup-content {
            background: rgba(10, 29, 44, 0.95) !important;
            color: #e0e8f0;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            padding: 8px 10px;
            font-size: 13px;
        }
        .city-name { font-weight: 600; margin-bottom: 2px; }
        .city-pop  { color: #90afc0; font-size: 12px; }

        /* ── Dataset popups ───────────────────────────────────────── */
        .ds-popup { max-width: 260px; }
        .ds-header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
        .ds-order { font-size: 11px; color: #7a9ab0; }
        .ds-city { font-size: 15px; font-weight: 700; color: #e0e8f0; }
        .ds-badge {
            display: inline-block;
            background: #c9a84c;
            color: #0a1d2c;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 3px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        .ds-loc  { font-size: 12px; color: #90afc0; margin-bottom: 2px; }
        .ds-date { font-size: 12px; color: #b0c8dc; font-style: italic; margin-bottom: 5px; }
        .ds-type {
            display: inline-block;
            font-size: 10px;
            color: #7a9ab0;
            border: 1px solid rgba(255,255,255,0.15);
            padding: 1px 5px;
            border-radius: 3px;
            margin-bottom: 5px;
            text-transform: capitalize;
        }
        .ds-notes { font-size: 12px; color: #c0d0e0; line-height: 1.45; }
    </style>
</head>
<body>

<div id="map"></div>
<div id="loading-badge">Loading map style…</div>

<!-- ── Controls ──────────────────────────────────────────────── -->
<div id="header" class="expanded">
    <div class="header-bar">
        <button id="header-toggle" title="Toggle controls">☰</button>
        <h1>Historical River Explorer</h1>
        <span id="count-label"></span>
    </div>
    <div class="header-body">

        <!-- OHM style switcher -->
        <div class="ctrl-group">
            <div class="ctrl-label">OHM Map Style</div>
            <div class="btn-row">
                <button class="btn style-btn active" data-style="main"           onclick="switchStyle(this)">Historical</button>
                <button class="btn style-btn"        data-style="woodblock"      onclick="switchStyle(this)">Woodblock</button>
                <button class="btn style-btn"        data-style="rail"           onclick="switchStyle(this)">Rail</button>
                <button class="btn style-btn"        data-style="japanese_scroll" onclick="switchStyle(this)">Japanese Scroll</button>
            </div>
        </div>

        <!-- Year / date filter -->
        <div class="ctrl-group">
            <div class="ctrl-label">Historical Year</div>
            <div class="year-readout">
                <span id="year-display">1850</span>
                <span class="year-suffix">CE</span>
            </div>
            <input type="range" id="year-slider"
                   min="1" max="1950" value="1850" step="1"
                   oninput="onYearSlider(this.value)">
            <div class="year-ends"><span>1 CE</span><span>1950</span></div>
        </div>

        <!-- Region -->
        <div class="ctrl-group">
            <div class="ctrl-label">Region</div>
            <div class="btn-row" id="region-switch">
                <button class="btn"        data-region="na" onclick="switchRegion(this)">N. America</button>
                <button class="btn active" data-region="eu" onclick="switchRegion(this)">Europe</button>
                <button class="btn"        data-region="sa" onclick="switchRegion(this)">S. America</button>
                <button class="btn"        data-region="af" onclick="switchRegion(this)">Africa</button>
                <button class="btn"        data-region="as" onclick="switchRegion(this)">Asia</button>
                <button class="btn"        data-region="oc" onclick="switchRegion(this)">Oceania</button>
            </div>
        </div>

        <!-- River detail -->
        <div class="ctrl-group">
            <div class="ctrl-label">River Detail</div>
            <div class="btn-row">
                <button class="btn filter-btn active" data-max-rank="3"  onclick="setFilter(this)">Major</button>
                <button class="btn filter-btn"        data-max-rank="6"  onclick="setFilter(this)">+Secondary</button>
                <button class="btn filter-btn"        data-max-rank="99" onclick="setFilter(this)">All</button>
            </div>
        </div>

        <!-- Cities -->
        <div class="ctrl-group">
            <div class="ctrl-label">Cities</div>
            <button class="btn" id="cities-btn" onclick="toggleCities(this)">Show</button>
        </div>

        <!-- Datasets -->
        <div class="ctrl-group">
            <div class="ctrl-label">Datasets</div>
            <div class="btn-row" id="dataset-btns">
                <button class="btn dataset-btn" data-dataset="antoinette"
                        onclick="toggleDataset(this)" title="Marie Antoinette's journey Vienna → Versailles, Apr–May 1770">
                    M. Antoinette 1770
                </button>
                <button class="btn dataset-btn" data-dataset="roman_roads"
                        onclick="toggleDataset(this)" title="Roman roads from the Itinerarium Antonini — 17 named roads across Italy, Gaul, Britain, and the Balkans">
                    Roman Roads
                </button>
            </div>
        </div>

    </div>
</div>

<!-- ── Info bar ───────────────────────────────────────────────── -->
<div id="info-bar" class="empty">
    <div class="river-swatch"></div>
    <div id="selected-name">Tap a river to see its name</div>
    <div id="selected-rank"></div>
</div>

<!-- ── Legend ────────────────────────────────────────────────── -->
<div id="legend">
    <div class="legend-title">Rivers</div>
    <div class="legend-row"><div class="l-line" style="width:20px;height:5px"></div>Major (rank 0–2)</div>
    <div class="legend-row"><div class="l-line" style="width:16px;height:3.5px"></div>Secondary (3–5)</div>
    <div class="legend-row"><div class="l-line" style="width:12px;height:2.5px"></div>Tributary (6+)</div>
    <div class="legend-row" style="margin-top:4px">
        <div class="l-line" style="width:20px;height:5px;background:#FFC107"></div>Selected
    </div>
</div>

<!-- Scripts: MapLibre, then the dates plugin (patches Map.prototype), then app -->
<script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@openhistoricalmap/maplibre-gl-dates/index.js"></script>
<script>

// ── Constants ────────────────────────────────────────────────

const DATA_BASE   = 'https://raw.githubusercontent.com/cobiadigital/night_time_geoguesser/main/';
const DATASET_DIR = 'data/'; // local data/ folder served alongside index.html

// Raw GitHub URLs for OHM style JSON files (GitHub Pages returns 404; raw.githubusercontent.com works)
const OHM_RAW = {
    main:            'https://raw.githubusercontent.com/OpenHistoricalMap/map-styles/main/main/main.json',
    woodblock:       'https://raw.githubusercontent.com/OpenHistoricalMap/map-styles/main/woodblock/woodblock.json',
    rail:            'https://raw.githubusercontent.com/OpenHistoricalMap/map-styles/main/rail/rail.json',
    japanese_scroll: 'https://raw.githubusercontent.com/OpenHistoricalMap/map-styles/main/japanese_scroll/ohm-japanese-scroll-map.json'
};

// Inside each style JSON, sprite/glyph URLs point to github.io — rewrite them to raw.githubusercontent.com
const GH_PAGES_BASE = 'https://openhistoricalmap.github.io/map-styles/';
const RAW_BASE      = 'https://raw.githubusercontent.com/OpenHistoricalMap/map-styles/main/';

async function fetchStyle(key) {
    const res   = await fetch(OHM_RAW[key]);
    if (!res.ok) throw new Error(`Style fetch failed: ${res.status}`);
    const style = await res.json();
    // Patch sprite and glyph URLs so they resolve via raw.githubusercontent.com
    if (style.sprite) style.sprite = style.sprite.replace(GH_PAGES_BASE, RAW_BASE);
    if (style.glyphs) style.glyphs = style.glyphs.replace(GH_PAGES_BASE, RAW_BASE);
    return style;
}

// ── Dataset registry ──────────────────────────────────────────
// Each entry defines how to load, render, and describe a dataset.
// Add new datasets here; the toggle/restore plumbing is generic.

const DATASETS = {
    antoinette: {
        label: "Marie Antoinette's Journey 1770",
        file:  'antoinette_1770.json',

        // Build GeoJSON sources from the raw stops array
        buildSources(stops) {
            const habsburg = stops.filter(s => s.order <= 28);
            const france   = stops.filter(s => s.order >= 28); // stop 28 (Kehl) in both
            const coord    = s => [s.lng, s.lat];
            return {
                'ds-antoinette-route-h': {
                    type: 'geojson',
                    data: { type: 'Feature', geometry: { type: 'LineString', coordinates: habsburg.map(coord) } }
                },
                'ds-antoinette-route-f': {
                    type: 'geojson',
                    data: { type: 'Feature', geometry: { type: 'LineString', coordinates: france.map(coord) } }
                },
                'ds-antoinette-stops': {
                    type: 'geojson',
                    data: {
                        type: 'FeatureCollection',
                        features: stops.map(s => ({
                            type: 'Feature',
                            properties: s,
                            geometry: { type: 'Point', coordinates: [s.lng, s.lat] }
                        }))
                    }
                }
            };
        },

        // MapLibre layer specs (visibility set separately)
        buildLayers() {
            return [
                {
                    id: 'ds-antoinette-route-h', type: 'line',
                    source: 'ds-antoinette-route-h',
                    layout: { 'line-cap': 'round', 'line-join': 'round' },
                    paint: { 'line-color': '#a01818', 'line-width': 2.5, 'line-dasharray': [4, 2.5] }
                },
                {
                    id: 'ds-antoinette-route-f', type: 'line',
                    source: 'ds-antoinette-route-f',
                    layout: { 'line-cap': 'round', 'line-join': 'round' },
                    paint: { 'line-color': '#1a3a8b', 'line-width': 2.5, 'line-dasharray': [4, 2.5] }
                },
                {
                    id: 'ds-antoinette-stops', type: 'circle',
                    source: 'ds-antoinette-stops',
                    paint: {
                        'circle-radius': ['case',
                            ['==', ['get', 'type'], 'ceremony'], 9,
                            ['==', ['get', 'type'], 'arrival'],  9,
                            ['==', ['get', 'type'], 'departure'], 7,
                            6
                        ],
                        'circle-color': ['case',
                            ['<=', ['get', 'order'], 27], '#c03030',
                            ['==', ['get', 'order'], 28], '#c9a84c',
                            '#2a50b8'
                        ],
                        'circle-stroke-color': '#ffffff',
                        'circle-stroke-width': 1.5,
                        'circle-opacity': 0.92
                    }
                }
            ];
        },

        // Clickable layer ids for popup handling
        clickLayers: ['ds-antoinette-stops'],

        // Popup HTML from a stop's properties
        popup(p) {
            return `<div class="ds-popup">
                <div class="ds-header">
                    <span class="ds-order">${p.order}.</span>
                    <span class="ds-city">${p.city}</span>
                </div>
                ${p.badge ? `<div class="ds-badge">${p.badge}</div>` : ''}
                <div class="ds-loc">${p.loc}</div>
                <div class="ds-date">${p.date} &nbsp;·&nbsp; Day ${p.day}</div>
                <div class="ds-type">${p.type}</div>
                <div class="ds-notes">${p.notes}</div>
            </div>`;
        }
    },

    roman_roads: {
        label: 'Roman Roads (Antonine)',
        file:  'roman_roads_ia.json',

        buildSources(roads) {
            return {
                'ds-roman-roads': {
                    type: 'geojson',
                    data: {
                        type: 'FeatureCollection',
                        features: roads.map(r => ({
                            type: 'Feature',
                            properties: {
                                id: r.id, name: r.name, also_known_as: r.also_known_as,
                                region: r.region, built: r.built, builder: r.builder,
                                length: r.length, ia_ref: r.ia_ref, tier: r.tier,
                                description: r.description
                            },
                            geometry: { type: 'LineString', coordinates: r.coords }
                        }))
                    }
                }
            };
        },

        buildLayers() {
            return [
                {
                    id: 'ds-roman-roads', type: 'line',
                    source: 'ds-roman-roads',
                    layout: { 'line-cap': 'round', 'line-join': 'round' },
                    paint: {
                        'line-color': ['case', ['==', ['get', 'tier'], 1], '#c8a84c', '#b8986a'],
                        'line-width': ['case', ['==', ['get', 'tier'], 1], 2.5, 1.5],
                        'line-opacity': 0.88
                    }
                }
            ];
        },

        clickLayers: ['ds-roman-roads'],

        popup(p) {
            return `<div class="ds-popup">
                <div class="ds-header">
                    <span class="ds-city">${p.name}</span>
                </div>
                ${p.also_known_as ? `<div class="ds-loc">${p.also_known_as}</div>` : ''}
                <div class="ds-date">Built: ${p.built}</div>
                ${p.builder ? `<div class="ds-notes" style="margin-bottom:3px">Builder: ${p.builder}</div>` : ''}
                <div class="ds-notes" style="margin-bottom:3px">Length: ${p.length} &nbsp;·&nbsp; Region: ${p.region}</div>
                <div class="ds-type">${p.ia_ref}</div>
                <div class="ds-notes" style="margin-top:5px">${p.description}</div>
            </div>`;
        }
    }
};

// Runtime state per dataset: { data, visible }
const datasetState = {};

const REGIONS = {
    na: { center: [-98.58,  39.83], zoom: 3,   file: 'na_rivers.json', cityFile: 'na_cities.json' },
    eu: { center: [ 15.0,   54.0 ], zoom: 3,   file: 'eu_rivers.json', cityFile: 'eu_cities.json' },
    sa: { center: [-60.0,  -15.0 ], zoom: 2.5, file: 'sa_rivers.json', cityFile: 'sa_cities.json' },
    af: { center: [ 20.0,    0.0 ], zoom: 2.5, file: 'af_rivers.json', cityFile: 'af_cities.json' },
    as: { center: [100.0,   30.0 ], zoom: 2.5, file: 'as_rivers.json', cityFile: 'as_cities.json' },
    oc: { center: [140.0,  -25.0 ], zoom: 2.5, file: 'oc_rivers.json', cityFile: 'oc_cities.json' }
};

const EMPTY_FC = { type: 'FeatureCollection', features: [] };

// ── Panel collapse (runs synchronously before map init) ───────

function initPanel(id, key, def) {
    const el = document.getElementById(id);
    const v  = localStorage.getItem(key);
    el.classList.toggle('expanded', v === null ? def : v === '1');
}
function togglePanel(id, key) {
    const el = document.getElementById(id);
    const v  = !el.classList.contains('expanded');
    el.classList.toggle('expanded', v);
    localStorage.setItem(key, v ? '1' : '0');
}
initPanel('header', 'ohgis.header', true);
document.getElementById('header-toggle')
    .addEventListener('click', () => togglePanel('header', 'ohgis.header'));

// ── Async map bootstrap ───────────────────────────────────────
// Fetch + patch the style before handing it to MapLibre so all
// internal sprite/glyph URLs are already pointing at raw.githubusercontent.com

document.getElementById('loading-badge').classList.add('show');

(async () => {
    const initialStyle = await fetchStyle('main');

    // ── App state ─────────────────────────────────────────────
    let currentRegion = 'eu';
    let currentDate   = '1850';
    let allRivers     = [];
    let savedRiverFC  = EMPTY_FC;
    let savedCityFC   = EMPTY_FC;
    let citiesLoaded  = false;
    let citiesVisible = false;
    let dateTimer     = null;

    // ── Map ───────────────────────────────────────────────────
    const map = new maplibregl.Map({
        container: 'map',
        style:     initialStyle,
        center:    REGIONS.eu.center,
        zoom:      REGIONS.eu.zoom,
        minZoom:   1.2,
        maxZoom:   9
    });

    map.addControl(
        new maplibregl.NavigationControl({ visualizePitch: true, showCompass: true }),
        'top-right'
    );

    // ── Custom river / city layers ────────────────────────────

    function addCustomSources() {
        if (!map.getSource('rivers'))
            map.addSource('rivers',           { type: 'geojson', data: EMPTY_FC });
        if (!map.getSource('rivers-highlight'))
            map.addSource('rivers-highlight', { type: 'geojson', data: EMPTY_FC });
        if (!map.getSource('cities'))
            map.addSource('cities',           { type: 'geojson', data: EMPTY_FC });
    }

    function addCustomLayers() {
        if (!map.getLayer('rivers-base')) {
            map.addLayer({
                id: 'rivers-base', type: 'line', source: 'rivers',
                layout: { 'line-cap': 'round', 'line-join': 'round' },
                paint: {
                    'line-color': '#75A8C8',
                    'line-width': ['case',
                        ['<=', ['get', 'scalerank'], 2], 5,
                        ['<=', ['get', 'scalerank'], 5], 3.5,
                        2.4
                    ]
                }
            });
        }
        if (!map.getLayer('rivers-highlight')) {
            map.addLayer({
                id: 'rivers-highlight', type: 'line', source: 'rivers-highlight',
                layout: { 'line-cap': 'round', 'line-join': 'round' },
                paint: {
                    'line-color': '#FFC107',
                    'line-width': ['case',
                        ['<=', ['get', 'scalerank'], 2], 6.5,
                        ['<=', ['get', 'scalerank'], 5], 5,
                        3.9
                    ]
                }
            });
        }
        if (!map.getLayer('cities-layer')) {
            map.addLayer({
                id: 'cities-layer', type: 'circle', source: 'cities',
                layout: { visibility: citiesVisible ? 'visible' : 'none' },
                paint: {
                    'circle-color':        '#FF9800',
                    'circle-opacity':      0.8,
                    'circle-stroke-color': 'rgba(255,255,255,0.45)',
                    'circle-stroke-width': 1,
                    'circle-radius': ['step', ['get', 'pop'],
                        3, 137491, 5, 292881, 7, 812229, 10, 2000000, 13]
                }
            });
        }
    }

    function restoreData() {
        if (savedRiverFC.features.length > 0) {
            map.getSource('rivers').setData(savedRiverFC);
            applyFilter();
        }
        if (citiesLoaded && savedCityFC.features.length > 0) {
            map.getSource('cities').setData(savedCityFC);
            if (citiesVisible) applyCityFilter();
        }
    }

    function onStyleReady() {
        try { map.setProjection({ type: 'globe' }); } catch (_) {}
        addCustomSources();
        addCustomLayers();
        restoreData();
        restoreDatasets();
        if (typeof map.filterByDate === 'function') map.filterByDate(currentDate);
        document.getElementById('loading-badge').classList.remove('show');
    }

    map.on('load', () => {
        onStyleReady();
        loadRegion('eu');
    });

    // ── River filtering ───────────────────────────────────────

    function rankAllowedAtZoom(z) {
        if (z <= 3) return 4;
        if (z <= 4) return 6;
        if (z <= 5) return 8;
        if (z <= 6) return 10;
        return 99;
    }

    function currentMaxRank() {
        const userMax = parseFloat(document.querySelector('.filter-btn.active').dataset.maxRank);
        return Math.min(userMax, rankAllowedAtZoom(map.getZoom()));
    }

    function applyFilter() {
        if (!map.getLayer('rivers-base')) return;
        const limit = currentMaxRank();
        map.setFilter('rivers-base', ['<=', ['get', 'scalerank'], limit]);
        const visible = allRivers.filter(r => r.scalerank <= limit).length;
        document.getElementById('count-label').textContent = `${visible} rivers`;
        clearHighlight();
        applyCityFilter();
    }

    function cityMinPopAtZoom(z) {
        if (z <= 3) return 812229;
        if (z <= 4) return 292881;
        if (z <= 5) return 137491;
        return 0;
    }

    function applyCityFilter() {
        if (!map.getLayer('cities-layer')) return;
        map.setFilter('cities-layer', ['>=', ['get', 'pop'], cityMinPopAtZoom(map.getZoom())]);
    }

    // ── Nearest-river click selection ─────────────────────────

    function haversineMiles(lat1, lon1, lat2, lon2) {
        const R    = 3958.8;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a    = Math.sin(dLat / 2) ** 2
                   + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180)
                   * Math.sin(dLon / 2) ** 2;
        return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function distanceToRiver(lat, lng, river) {
        let best = Infinity;
        for (const seg of river.segments)
            for (const [plat, plng] of seg) {
                const d = haversineMiles(lat, lng, plat, plng);
                if (d < best) best = d;
            }
        return best;
    }

    function setInfoBar(item) {
        const bar    = document.getElementById('info-bar');
        const nameEl = document.getElementById('selected-name');
        const rankEl = document.getElementById('selected-rank');
        if (item) {
            bar.classList.remove('empty');
            nameEl.textContent = item.river.name;
            rankEl.textContent = `Rank ${item.scalerank}`;
        } else {
            bar.classList.add('empty');
            nameEl.textContent = 'Tap a river to see its name';
            rankEl.textContent = '';
        }
    }

    function clearHighlight() {
        const src = map.getSource('rivers-highlight');
        if (src) src.setData(EMPTY_FC);
        setInfoBar(null);
    }

    function highlightRiver(item) {
        map.getSource('rivers-highlight').setData({
            type: 'FeatureCollection',
            features: item.river.segments.map(seg => ({
                type: 'Feature',
                properties: { scalerank: item.scalerank },
                geometry: { type: 'LineString', coordinates: seg.map(([lat, lng]) => [lng, lat]) }
            }))
        });
    }

    map.on('click', e => {
        // Dataset stop clicks (highest priority)
        for (const [key, def] of Object.entries(DATASETS)) {
            const state = datasetState[key];
            if (!state || !state.visible) continue;
            const activeLayers = def.clickLayers.filter(id => map.getLayer(id));
            if (!activeLayers.length) continue;
            const hits = map.queryRenderedFeatures(e.point, { layers: activeLayers });
            if (hits.length) {
                const props = hits[0].properties;
                const popupAt = hits[0].geometry.type === 'Point'
                    ? hits[0].geometry.coordinates
                    : [e.lngLat.lng, e.lngLat.lat];
                new maplibregl.Popup({ closeButton: true, offset: 10, maxWidth: '300px' })
                    .setLngLat(popupAt)
                    .setHTML(def.popup(props))
                    .addTo(map);
                return;
            }
        }

        // City clicks
        if (citiesVisible) {
            const hits = map.queryRenderedFeatures(e.point, { layers: ['cities-layer'] });
            if (hits.length) {
                const { name, pop } = hits[0].properties;
                new maplibregl.Popup({ closeButton: true, offset: 10 })
                    .setLngLat(hits[0].geometry.coordinates)
                    .setHTML(`<div class="city-name">${name}</div><div class="city-pop">Pop. ${formatPop(pop)}</div>`)
                    .addTo(map);
                return;
            }
        }

        // River selection
        const { lat, lng } = e.lngLat;
        const limit        = currentMaxRank();
        let nearest = null, best = Infinity;
        for (const item of allRivers) {
            if (item.scalerank > limit) continue;
            const d = distanceToRiver(lat, lng, item.river);
            if (d < best) { best = d; nearest = item; }
        }
        clearHighlight();
        if (!nearest || best > 75) return;
        highlightRiver(nearest);
        setInfoBar(nearest);
    });

    map.on('mouseenter', 'cities-layer', () => { map.getCanvas().style.cursor = 'pointer';   });
    map.on('mouseleave', 'cities-layer', () => { map.getCanvas().style.cursor = '';           });
    map.on('mouseenter', 'rivers-base',  () => { map.getCanvas().style.cursor = 'crosshair'; });
    map.on('mouseleave', 'rivers-base',  () => { map.getCanvas().style.cursor = '';           });
    map.on('zoomend', applyFilter);

    // ── Data loading ──────────────────────────────────────────

    function loadRegion(key) {
        currentRegion = key;
        allRivers     = [];
        savedRiverFC  = EMPTY_FC;
        clearHighlight();
        if (map.getSource('rivers')) map.getSource('rivers').setData(EMPTY_FC);
        document.getElementById('count-label').textContent = 'Loading…';
        map.flyTo({ center: REGIONS[key].center, zoom: REGIONS[key].zoom, duration: 1400 });

        citiesLoaded  = false;
        savedCityFC   = EMPTY_FC;
        citiesVisible = false;
        const citiesBtn = document.getElementById('cities-btn');
        citiesBtn.classList.remove('active');
        citiesBtn.textContent = 'Show';
        if (map.getLayer('cities-layer')) {
            map.setLayoutProperty('cities-layer', 'visibility', 'none');
            map.getSource('cities').setData(EMPTY_FC);
        }

        fetch(DATA_BASE + REGIONS[key].file)
            .then(r => { if (!r.ok) throw r.status; return r.json(); })
            .then(rivers => {
                allRivers    = rivers.map(r => ({ river: r, scalerank: r.scalerank }));
                savedRiverFC = {
                    type: 'FeatureCollection',
                    features: rivers.flatMap(r =>
                        r.segments.map(seg => ({
                            type: 'Feature',
                            properties: { name: r.name, scalerank: r.scalerank },
                            geometry: {
                                type: 'LineString',
                                coordinates: seg.map(([lat, lng]) => [lng, lat])
                            }
                        }))
                    )
                };
                if (map.getSource('rivers')) {
                    map.getSource('rivers').setData(savedRiverFC);
                    applyFilter();
                }
            })
            .catch(err => {
                document.getElementById('count-label').textContent = 'Error loading river data';
                console.error('River load failed:', err);
            });
    }

    // ── Control callbacks (exposed to window for onclick attrs) ──

    window.switchRegion = function(btn) {
        document.querySelectorAll('#region-switch .btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        loadRegion(btn.dataset.region);
    };

    window.setFilter = function(btn) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        applyFilter();
    };

    window.switchStyle = async function(btn) {
        document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('loading-badge').classList.add('show');
        try {
            const style = await fetchStyle(btn.dataset.style);
            map.setStyle(style);
            map.once('styledata', onStyleReady);
        } catch (err) {
            console.error('Style switch failed:', err);
            document.getElementById('loading-badge').classList.remove('show');
        }
    };

    window.onYearSlider = function(val) {
        currentDate = String(val);
        document.getElementById('year-display').textContent = val;
        clearTimeout(dateTimer);
        dateTimer = setTimeout(() => {
            if (typeof map.filterByDate === 'function') map.filterByDate(currentDate);
        }, 250);
    };

    window.toggleCities = function(btn) {
        citiesVisible = !citiesVisible;
        btn.classList.toggle('active', citiesVisible);
        btn.textContent = citiesVisible ? 'Hide' : 'Show';
        if (map.getLayer('cities-layer'))
            map.setLayoutProperty('cities-layer', 'visibility', citiesVisible ? 'visible' : 'none');

        if (citiesVisible && !citiesLoaded) {
            citiesLoaded = true;
            fetch(DATA_BASE + REGIONS[currentRegion].cityFile)
                .then(r => { if (!r.ok) throw r.status; return r.json(); })
                .then(cities => {
                    savedCityFC = {
                        type: 'FeatureCollection',
                        features: cities.map(c => ({
                            type: 'Feature',
                            properties: { name: c.name, pop: c.pop },
                            geometry: { type: 'Point', coordinates: [c.lng, c.lat] }
                        }))
                    };
                    map.getSource('cities').setData(savedCityFC);
                    applyCityFilter();
                })
                .catch(() => { citiesLoaded = false; });
        }
    };

    function formatPop(n) {
        if (n >= 1_000_000) return (n / 1_000_000).toFixed(2).replace(/\.?0+$/, '') + 'M';
        if (n >= 1_000)     return (n / 1_000).toFixed(0) + 'k';
        return String(n);
    }

    // ── Dataset layer management ──────────────────────────────

    function applyDatasetLayers(key) {
        const def   = DATASETS[key];
        const state = datasetState[key];
        if (!state.data) return;

        // Upsert sources
        for (const [id, spec] of Object.entries(def.buildSources(state.data))) {
            if (map.getSource(id)) map.getSource(id).setData(spec.data);
            else                   map.addSource(id, spec);
        }

        // Upsert layers
        for (const layerSpec of def.buildLayers()) {
            if (!map.getLayer(layerSpec.id)) map.addLayer(layerSpec);
            map.setLayoutProperty(layerSpec.id, 'visibility', state.visible ? 'visible' : 'none');
        }

        // Pointer cursor on hover
        for (const lid of def.clickLayers) {
            if (!map.getLayer(lid)) continue;
            map.on('mouseenter', lid, () => { map.getCanvas().style.cursor = 'pointer'; });
            map.on('mouseleave', lid, () => { map.getCanvas().style.cursor = '';        });
        }
    }

    function restoreDatasets() {
        for (const key of Object.keys(datasetState)) {
            if (datasetState[key].data) applyDatasetLayers(key);
        }
    }

    window.toggleDataset = async function(btn) {
        const key   = btn.dataset.dataset;
        const state = datasetState[key] || (datasetState[key] = { data: null, visible: false });

        state.visible = !state.visible;
        btn.classList.toggle('active', state.visible);

        if (state.visible && !state.data) {
            btn.textContent = 'Loading…';
            btn.disabled    = true;
            try {
                const res    = await fetch(DATASET_DIR + DATASETS[key].file);
                if (!res.ok) throw new Error(res.status);
                state.data   = await res.json();
            } catch (err) {
                console.error('Dataset load failed:', err);
                state.visible   = false;
                btn.classList.remove('active');
                btn.textContent = DATASETS[key].label || key;
                btn.disabled    = false;
                return;
            }
            btn.textContent = btn.dataset.label || btn.textContent;
            btn.disabled    = false;
        }

        applyDatasetLayers(key);
    };

    // Restore button labels after async load
    document.querySelectorAll('.dataset-btn').forEach(btn => {
        btn.dataset.label = btn.textContent;
    });

})().catch(err => {
    console.error('App init failed:', err);
    document.getElementById('loading-badge').textContent = 'Failed to load map style';
    document.getElementById('loading-badge').classList.add('show');
});

</script>
</body>
</html>
